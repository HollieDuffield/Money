<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Money">
<meta name="theme-color" content="#F7F2EC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>My Money</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Cormorant+Garamond:wght@500;600&family=Figtree:wght@400;500;600;700&family=Instrument+Serif&family=Nunito:wght@400;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:inherit}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --accent:#C8507F; --paper-l:#F7F2EC; --card-l:#FFFCF8;
  --paper:var(--paper-l); --card:var(--card-l);
  --ink:#2A2220; --muted:#776B65; --faint:#A89D97;
  --line:color-mix(in srgb,var(--ink) 11%,transparent);
  --sunk:color-mix(in srgb,var(--ink) 4.5%,var(--paper));
  --soft:color-mix(in srgb,var(--accent) 15%,var(--card));
  --soft2:color-mix(in srgb,var(--accent) 7%,var(--card));
  --accent-ink:color-mix(in srgb,var(--accent) 72%,var(--ink));
  --on-accent:#fff;
  --good:#5E8B57; --warn:#C9743A; --danger:#B44A4A; --period:#C94B5B;
  --hfont:'Instrument Serif',Georgia,serif; --hw:400; --hs:1.08;
  --bfont:'Figtree',system-ui,-apple-system,sans-serif;
  --r:18px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:color-mix(in srgb,var(--accent) 5%,#161413);
    --card:color-mix(in srgb,var(--accent) 6%,#221F1D);
    --ink:#F0EAE5; --muted:#AFA49E; --faint:#7D736E;
    --sunk:color-mix(in srgb,#fff 4%,var(--paper));
    --soft:color-mix(in srgb,var(--accent) 26%,var(--card));
    --soft2:color-mix(in srgb,var(--accent) 12%,var(--card));
    --accent-ink:color-mix(in srgb,var(--accent) 60%,#fff);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:color-mix(in srgb,var(--accent) 5%,#161413);
  --card:color-mix(in srgb,var(--accent) 6%,#221F1D);
  --ink:#F0EAE5; --muted:#AFA49E; --faint:#7D736E;
  --sunk:color-mix(in srgb,#fff 4%,var(--paper));
  --soft:color-mix(in srgb,var(--accent) 26%,var(--card));
  --soft2:color-mix(in srgb,var(--accent) 12%,var(--card));
  --accent-ink:color-mix(in srgb,var(--accent) 60%,#fff);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--bfont);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default;opacity:.45}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--hfont);font-weight:var(--hw);margin:0;line-height:1.05;letter-spacing:-.01em}
p{margin:0}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .sp{flex:1}
.hint{font-size:13px;color:var(--muted);margin:-4px 0 12px}

/* layout */
.side{position:fixed;top:0;bottom:0;left:0;width:250px;padding:calc(env(safe-area-inset-top,0px) + 20px) 14px calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--paper);border-right:1px solid var(--line);overflow-y:auto;z-index:60;transform:translateX(-105%);transition:transform .25s ease;display:flex;flex-direction:column}
.side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.18)}
.scrim{position:fixed;inset:0;background:rgba(20,15,12,.3);z-index:55;display:none}
.scrim.on{display:block}
.brand{font-family:var(--hfont);font-weight:var(--hw);font-size:calc(26px * var(--hs));padding:0 10px 14px;display:flex;align-items:center;gap:8px}
.brand-mark{color:var(--accent);font-size:18px}
.ng{margin-bottom:12px}
.ngl{font-size:12px;color:var(--faint);font-weight:600;padding:6px 10px 4px}
.ni{display:block;width:100%;padding:8px 10px;border-radius:10px;font-weight:500;color:var(--ink);font-size:15px}
.ni:hover{background:var(--sunk)}
.ni.on{background:var(--soft);color:var(--accent-ink);font-weight:600}
.side-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.sync{font-size:12px;color:var(--muted);padding:6px 10px;display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
.sync.live i{background:var(--good)} .sync.busy i{background:var(--warn)} .sync.err i{background:var(--danger)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:8px;padding:10px 16px;background:color-mix(in srgb,var(--paper) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.tb-title{flex:1;font-family:var(--hfont);font-weight:var(--hw);font-size:calc(22px * var(--hs));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:4px 16px 130px;max-width:1180px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;align-items:center;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 10px;min-width:56px;text-align:center}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent-ink)}
.tab.plus span{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:26px;line-height:1;margin-top:-4px}
@media(min-width:960px){
  .side{transform:none;box-shadow:none}
  .mainwrap{margin-left:250px}
  .tabbar,.menu-btn,.scrim{display:none!important}
  .tb-title{visibility:hidden}
  main{padding:4px 32px 60px}
}

/* type & headers */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin:10px 0 20px}
.ph h1{font-size:calc(clamp(36px,8vw,56px) * var(--hs))}
.ph .sub{color:var(--muted);margin-top:8px;font-size:15px}
.nav2{display:flex;align-items:center;gap:6px}
.datenav{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.dn-date{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;min-height:36px}
.lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.link{color:var(--accent-ink);font-weight:600;font-size:14px;white-space:nowrap}
.link.sm{font-size:13px}

/* buttons, inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;white-space:nowrap;min-height:38px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.soft{background:var(--soft);border-color:transparent;color:var(--accent-ink)}
.btn.sm{padding:5px 12px;font-size:13px;min-height:32px}
.btn.danger{color:var(--danger)}
.icon-btn{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--card);flex:none;font-size:18px;line-height:1}
.icon-btn svg{width:18px;height:18px}
.in{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);font-size:16px;min-height:44px}
.in.sm{padding:6px 9px;min-height:36px;font-size:15px}
textarea.in{min-height:110px;resize:vertical;line-height:1.5}
select.in{appearance:auto}
.field{display:block;margin-bottom:12px;min-width:0}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:0 10px}
.add-in{margin-top:10px;background:transparent;border-style:dashed}
.range{width:100%;accent-color:var(--accent)}
.range.unset{opacity:.45}

/* cards */
.cards{columns:2 340px;column-gap:16px}
.card{break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 16px;display:block;width:100%}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h3{font-size:calc(23px * var(--hs))}
.empty{padding:22px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;gap:12px}

/* rows */
.trow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);min-height:42px}
.trow:last-child{border-bottom:0}
.trow .t{flex:1;min-width:0;overflow-wrap:anywhere}
.trow.done .t{text-decoration:line-through;color:var(--faint)}
.trow.sm{padding:5px 0;min-height:34px;font-size:14px}
.ck{width:24px;height:24px;border-radius:8px;border:1.5px solid color-mix(in srgb,var(--ink) 28%,transparent);display:inline-grid;place-items:center;flex:none;background:var(--card)}
.ck.sm{width:20px;height:20px;border-radius:6px}
.ck.on{background:var(--accent);border-color:var(--accent)}
.ck.on::after{content:'';width:10px;height:5px;border:2px solid var(--on-accent);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;vertical-align:middle}
.x{color:var(--faint);width:30px;height:30px;border-radius:50%;flex:none;font-size:18px;display:inline-grid;place-items:center}
.x:hover{background:var(--sunk);color:var(--ink)}
.tbadge{width:26px;height:26px;border-radius:8px;background:color-mix(in srgb,var(--c) 18%,var(--card));color:color-mix(in srgb,var(--c) 75%,var(--ink));display:inline-grid;place-items:center;font-weight:700;font-size:13px;flex:none}

/* chips & segmented */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:pointer;min-height:36px}
.chip.sm{padding:5px 10px;font-size:13px;min-height:30px}
.chip.on,.chip:has(input:checked){background:var(--soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent-ink);font-weight:600}
.chip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.hchip{background:linear-gradient(90deg,var(--soft) var(--p),var(--card) var(--p))}
.hchip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;overflow-x:auto;max-width:100%;margin-bottom:16px}
.seg button{padding:7px 15px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
details.more{margin-top:10px}
details.more summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--accent-ink);margin-bottom:8px}

/* today */
.prios{display:flex;flex-direction:column;gap:8px}
.prio{display:flex;align-items:center;gap:10px}
.pnum{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--accent-ink);font-weight:700;display:grid;place-items:center;flex:none;font-size:14px}
.pnum.on{background:var(--good);color:#fff}
.pnum.on::after{content:'✓'}
.pin{flex:1;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 2px;font-size:16px;min-width:0}
.pin:focus{outline:none;border-bottom-color:var(--accent)}
.prio.done .pin{text-decoration:line-through;color:var(--faint)}
.tl{display:grid;grid-template-columns:50px 1fr}
.tl .hr{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:5px}
.tl .slot{border-top:1px solid var(--line);min-height:30px;padding:4px 0 6px;display:flex;flex-direction:column;gap:4px}
.tl .nowh{color:var(--accent-ink);font-weight:700}
.tl .nows{border-top:2px solid var(--accent)}
.allday{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.ev{display:block;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 13%,var(--card));border-radius:8px;padding:6px 10px;font-size:14px;width:100%;text-align:left;overflow-wrap:anywhere}
.ev small{display:block;color:var(--muted);font-size:12px}
.ev.sm{font-size:12.5px;padding:4px 8px}
.moods{display:flex;gap:6px;margin-top:6px}
.mood{font-size:26px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;filter:grayscale(.6);opacity:.6;border:2px solid transparent}
.mood.on{filter:none;opacity:1;border-color:var(--accent);background:var(--soft)}
.qdots{display:flex;gap:6px;align-items:center;min-height:44px}
.qd{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:var(--sunk)}
.qd.on{background:var(--accent);border-color:var(--accent)}
.drops{display:flex;flex-wrap:wrap;gap:6px}
.drop{width:34px;height:38px;display:grid;place-items:center;color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.drop svg{width:24px;height:30px}
.drop.on{color:var(--accent)}
.drop.add{border:1.5px dashed var(--line);border-radius:10px;color:var(--muted);font-size:18px}
.food-sum{display:flex;gap:16px;align-items:center}
.ring{position:relative;flex:none}
.ring svg{width:100%;height:100%}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.1}
.ring-in b{font-family:var(--hfont);font-weight:var(--hw);font-size:calc(24px * var(--hs))}
.ring-in small{font-size:11px;color:var(--muted)}
.macros{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.mb-h{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.mb-h span:first-child{color:var(--ink);font-weight:600}
.bar{height:7px;border-radius:9px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.mini-meals{margin-top:12px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.cyc{display:flex;flex-direction:column;gap:6px}
.cyc-day{display:flex;align-items:baseline;gap:10px}
.cyc-day b{font-family:var(--hfont);font-weight:var(--hw);font-size:calc(30px * var(--hs))}
.cyc-day span{color:var(--period);font-weight:600}

/* week */
.week{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(80%,1fr);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;-webkit-overflow-scrolling:touch}
@media(min-width:600px){.week{grid-auto-columns:minmax(230px,1fr)}}
@media(min-width:1300px){.week{grid-auto-columns:1fr}}
.wcol{scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:280px;display:flex;flex-direction:column;gap:8px;min-width:0}
.wcol.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wdh{display:flex;align-items:baseline;gap:8px}
.wdh span{font-size:13px;font-weight:700;color:var(--muted)}
.wdh b{font-family:var(--hfont);font-weight:var(--hw);font-size:calc(30px * var(--hs))}
.wev{display:flex;flex-direction:column;gap:4px}
.wfoot{margin-top:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);padding-top:6px}
.wfoot .link{margin-left:auto}
.glance{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.glance b{display:block;font-family:var(--hfont);font-weight:var(--hw);font-size:calc(28px * var(--hs))}
.glance span{font-size:12px;color:var(--muted)}

/* month */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mh{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.mcell{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:92px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden;font-size:12px;min-width:0}
.mcell.out{opacity:.38}
.mcell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mcell .n{font-weight:700;font-size:13px}
.mcell .evt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.mcell .evt .dot{margin-right:4px;width:6px;height:6px}
.mcell .sc{margin-top:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px}
.mcell .dots{display:none;gap:3px;flex-wrap:wrap}
.mcell .dots .dot{width:6px;height:6px}
.pd{width:8px;height:8px;border-radius:50%;background:var(--period);display:inline-block}
.pd.pred{background:transparent;border:1.5px solid var(--period)}
.mcell .pd{position:absolute;top:8px;right:7px}
@media(max-width:640px){.mgrid{gap:4px}.mcell{min-height:62px;padding:4px;border-radius:9px}.mcell .evt{display:none}.mcell .dots{display:flex}}

/* stats & habits */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media(min-width:760px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .v{font-family:var(--hfont);font-weight:var(--hw);font-size:calc(42px * var(--hs));line-height:1;margin:8px 0 4px}
.stat small{color:var(--muted);font-size:13px}
.stat.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stat.dark .lbl{color:color-mix(in srgb,var(--accent) 55%,var(--paper))}
.stat.dark small{color:color-mix(in srgb,var(--paper) 75%,transparent)}
.hgrid-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
table.hgrid{border-collapse:separate;border-spacing:4px}
.hgrid th{font-size:11.5px;color:var(--muted);font-weight:600;min-width:28px;text-align:center}
.hgrid th.today{color:var(--accent-ink)}
.hgrid td{padding:0}
.hgrid td.name{position:sticky;left:0;background:var(--card);padding-right:8px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;font-size:14px;z-index:1}
.hgrid td.stk{white-space:nowrap;font-size:12.5px;color:var(--accent-ink);font-weight:600;padding-left:8px}
.sq{width:28px;height:28px;border-radius:8px;background:var(--sunk);border:1px solid var(--line);display:block}
.sq.on{background:var(--accent);border-color:var(--accent)}
.sq.part{background:linear-gradient(to top,var(--soft) var(--p),var(--sunk) var(--p))}
.sq.today{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
.sq.nd{background:transparent;border-style:dashed}
.hlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left}
.hcard .hn{font-weight:600;font-size:16px}
.hcard .hm{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.hcard .hm b{color:var(--ink)}

/* charts */

const fmtCache={};
function money(v,dp=2){v=Number(v)||0;const cur=S().cur||'GBP',k=cur+dp;try{if(!fmtCache[k])fmtCache[k]=new Intl.NumberFormat('en-GB',{style:'currency',currency:cur,minimumFractionDigits:dp,maximumFractionDigits:dp});return fmtCache[k].format(v);}catch(e){return '£'+v.toFixed(dp);}}
const mt=v=>money(v,Math.abs(v)>=1000||Math.round(v)===Number(v)?0:2);
const monthsBetween=(a,b)=>{const [ay,am]=a.split('-').map(Number),[by,bm]=b.split('-').map(Number);return (by-ay)*12+(bm-am);};
const ordinal=n=>n+(n%100>=11&&n%100<=13?'th':['th','st','nd','rd'][n%10]||'th');

/* payday */
function paydayIn(mk){const p=S().payday||{};let day=p.last?daysInMonth(mk):Math.min(p.day||25,daysInMonth(mk));let k=mk+'-'+pad(day);const w=dow(k);
  if(p.weekend==='before'){if(w===6)k=addDays(k,-1);else if(w===0)k=addDays(k,-2);}
  else if(p.weekend==='after'){if(w===6)k=addDays(k,2);else if(w===0)k=addDays(k,1);}
  return k;}
function nextPayday(){const t=todayKey();let p=paydayIn(curMonth());if(p<t)p=paydayIn(addMonths(curMonth(),1));return p;}

const txOf=mk=>{const d=DOCS['t-'+mk];return (d&&d.data.tx)||[];};

const txMonths=()=>Object.keys(DOCS).filter(k=>k.startsWith('t-')).map(k=>k.slice(2)).sort();
function spendOf(t){const c=catOf(t.cat);if(c&&c.kind!=='spend')return 0;if(!t.cat&&t.amt>0)return 0;return -t.amt;}
function monthSpend(mk){const by={};let total=0,inc=0;for(const t of txOf(mk)){const s=spendOf(t);if(s){total+=s;const k=t.cat||'none';by[k]=(by[k]||0)+s;}const c=catOf(t.cat);if(c&&c.kind==='income')inc+=t.amt;}return {total,by,inc};}
const needsCat=mk=>txOf(mk).filter(t=>!t.cat).length;
function cleanDesc(d){
  let s=String(d||'').replace(/\s+/g,' ').trim();
  s=s.replace(/^(card payment to|card purchase|purchase|pos|debit card payment|contactless payment|contactless|direct debit payment to|direct debit to|direct debit|standing order to|faster payment to|bill payment to|payment to|dd|so|fpo|fpi|deb|bgc|tfr|vis|cpt|pos purchase)\s+/i,'');
  s=s.replace(/\bon \d{1,2}[\/\- ][a-z0-9]{2,3}([\/\- ]\d{2,4})?\b.*$/i,'');
  s=s.replace(/\s\d{1,2}(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)\d{0,4}\b.*$/i,'');
  s=s.replace(/[*#]+\s*[a-z0-9]*\d[a-z0-9]*/gi,' ').replace(/\b\d{4,}\b/g,' ').replace(/\b(gb|gbr|uk|london)\b\s*$/i,'').replace(/\s{2,}/g,' ').trim();
  return s||String(d||'').trim();
}
function niceName(d){const s=cleanDesc(d);return s===s.toUpperCase()?s.toLowerCase().replace(/(^|[\s\-&'(])([a-z])/g,(m,a,b)=>a+b.toUpperCase()):s;}
function merchantKey(d){return cleanDesc(d).toLowerCase().replace(/[^a-z&' ]+/g,' ').replace(/\s+/g,' ').trim().split(' ').slice(0,2).join(' ');}
function autoCat(desc,amt){
  const d=String(desc||'').toLowerCase();
  for(const r of S().rules||[])if(r.match&&d.includes(r.match.toLowerCase())&&catOf(r.cat))return r.cat;
  for(const [c,rx] of BUILTIN){if(!catOf(c))continue;if(rx.test(d)){if(amt>0&&c!=='transfers'&&c!=='income'&&catOf(c).kind==='spend')return c;if(amt<0&&c==='income')continue;return c;}}
  return amt>0?'income':'';
}

/* CSV */
function parseCSV(text){
  text=String(text).replace(/^\uFEFF/,'');
  const first=text.split(/\r?\n/).find(l=>l.trim())||'';
  const delim=[',',';','\t'].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===delim){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}
    else f+=c;}
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.some(x=>x!==''));
}
const MONIDX={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
function parseDateStr(s,fmt){
  s=String(s||'').trim();let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if((m=s.match(/^(\d{1,2})[\s\-\/]([A-Za-z]{3,9})[\s\-\/,]*(\d{2,4})/))){const mo=MONIDX[m[2].toLowerCase().slice(0,4)]||MONIDX[m[2].toLowerCase().slice(0,3)];if(!mo)return null;let y=+m[3];if(y<100)y+=2000;return y+'-'+pad(mo)+'-'+pad(+m[1]);}
  if((m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/))){let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;const [d,mo]=fmt==='mdy'?[b,a]:[a,b];if(mo<1||mo>12||d<1||d>31)return null;return y+'-'+pad(mo)+'-'+pad(d);}
  return null;
}
function parseAmt(s){
  if(s==null)return null;let v=String(s).trim();if(!v)return null;
  let neg=false;if(/^\(.*\)$/.test(v)){neg=true;v=v.slice(1,-1);}
  if(/\bDR\b/i.test(v))neg=true;
  v=v.replace(/\b(CR|DR)\b/gi,'').replace(/[£$€\s,]/g,'');
  if(v.startsWith('-')){neg=!neg;v=v.slice(1);}if(v.startsWith('+'))v=v.slice(1);
  const n=parseFloat(v);if(!isFinite(n))return null;return neg?-n:n;
}
function guessMap(rows){
  let hi=rows.slice(0,10).findIndex(r=>r.some(c=>/date/i.test(c)));
  const hasHead=hi>=0;if(!hasHead)hi=-1;
  const head=hasHead?rows[hi]:rows[0].map((_,i)=>'Column '+(i+1));
  const H=head.map(h=>h.toLowerCase());
  const find=(rx,not)=>H.findIndex(h=>rx.test(h)&&!(not&&not.test(h)));
  const m={hi,head,date:find(/date/,/posted|value date/),desc:-1,amt:find(/^amount|amount \(|^value$|^amount$|transaction amount/,/balance/),out:find(/debit|paid out|money out|withdrawal|^out$/),inn:find(/credit|paid in|money in|deposit|^in$/),flip:false,fmt:'dmy',acct:''};
  if(m.date<0)m.date=find(/date/);
  for(const k of ['description','transaction description','details','merchant','name','narrative','payee','counter party','counterparty','reference','memo']){const i=H.findIndex(h=>h===k||h.includes(k));if(i>=0&&i!==m.date){m.desc=i;break;}}
  if(m.amt<0&&m.out<0&&m.inn<0)m.amt=find(/amount/);
  if(m.amt>=0){m.out=-1;m.inn=-1;}
  const body=rows.slice(hi+1);
  if(m.amt>=0){const vals=body.map(r=>parseAmt(r[m.amt])).filter(v=>v!=null);if(vals.length&&vals.filter(v=>v>0).length/vals.length>0.5)m.flip=true;}
  if(m.date>=0){const ds=body.map(r=>r[m.date]||'');if(ds.some(d=>{const x=d.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-]/);return x&&+x[2]>12&&+x[1]<=12;}))m.fmt='mdy';}
  return m;
}
function mapRows(rows,m){
  const out=[];
  for(const r of rows.slice(m.hi+1)){
    const date=parseDateStr(r[m.date],m.fmt);if(!date)continue;
    let amt=null;
    if(m.amt>=0)amt=parseAmt(r[m.amt]);
    else{const o=parseAmt(r[m.out]),i=parseAmt(r[m.inn]);if(o)amt=-Math.abs(o);else if(i)amt=Math.abs(i);}
    if(amt==null||amt===0)continue;
    if(m.flip)amt=-amt;
    const desc=(m.desc>=0?r[m.desc]:'')||'Transaction';
    out.push({date,desc,amt:round(amt,2)});
  }
  return out;
}

/* bills */
function billDates(b,mk){
  if(!b.first)return [];if(b.until&&mk>b.until)return [];
  const first=mk+'-01',last=mk+'-'+pad(daysInMonth(mk)),f=b.first,out=[];
  if(last<f)return [];
  const fr=b.freq||'monthly';
  if(fr==='weekly'||fr==='fortnightly'||fr==='fourweekly'){const step=FREQ[fr][2];let d=f;if(d<first){const n=Math.ceil(diffDays(d,first)/step);d=addDays(f,n*step);}while(d<=last){out.push(d);d=addDays(d,step);}}
  else{const every=FREQ[fr][2],diff=monthsBetween(monthKey(f),mk);if(diff>=0&&diff%every===0){const day=Math.min(parseKey(f).getDate(),daysInMonth(mk));out.push(mk+'-'+pad(day));}}
  return out.filter(d=>d>=f);
}
const billMonthly=b=>num(b.amt)*FREQ[b.freq||'monthly'][1];
function upcomingBills(days){const t=todayKey(),end=addDays(t,days),out=[];let mk=monthKey(t);while(mk<=monthKey(end)){for(const b of D('bills').list)for(const d of billDates(b,mk))if(d>=t&&d<=end)out.push({b,d});mk=addMonths(mk,1);}return out.sort((a,b)=>a.d<b.d?-1:1);}
function nextBillDate(b){const t=todayKey();let mk=monthKey(t);for(let i=0;i<14;i++){const ds=billDates(b,mk).filter(d=>d>=t);if(ds.length)return ds[0];mk=addMonths(mk,1);}return null;}

/* pots & debts */
function paidEntries(key){const out=[];for(const k in DOCS){if(!k.startsWith('mo-'))continue;const p=(DOCS[k].data.paid||{})[key];if(p)out.push({mk:k.slice(3),a:num(p.a),t:p.t||0});}return out;}
function potBal(p,upto){let b=num(p.start);const st=p.startT||0;for(const e of paidEntries('p:'+p.id))if(e.t>st&&(!upto||e.mk<=upto))b+=e.a;for(const a of (p.adj||[]))if((a.t||0)>st&&(!upto||monthKey(a.date)<=upto))b+=num(a.amt);return round(b,2);}
function debtPaid(d,upto){let s=0;const st=d.startT||0;for(const e of paidEntries('d:'+d.id))if(e.t>st&&(!upto||e.mk<=upto))s+=e.a;for(const a of (d.adj||[]))if((a.t||0)>st&&(!upto||monthKey(a.date)<=upto))s+=num(a.amt);return s;}
const debtBal=(d,upto)=>Math.max(0,round(num(d.start)-debtPaid(d,upto),2));
function payoff(bal,apr,pay){if(bal<=0)return {n:0,interest:0};const i=num(apr)/1200;pay=num(pay);if(pay<=0)return null;if(i===0)return {n:Math.ceil(bal/pay),interest:0};if(pay<=bal*i)return null;const n=Math.ceil(-Math.log(1-i*bal/pay)/Math.log(1+i));return {n,interest:Math.max(0,n*pay-bal)};}
const pots=()=>D('pots').list.filter(p=>!p.until||p.until>=curMonth());
const ATYPES={cash:['Cash savings','🏦'],isa:['Cash ISA','🔒'],sisa:['Stocks & shares ISA','📈'],invest:['Investments','📊'],shares:['Work shares','🏢'],pension:['Pension','🌱'],crypto:['Crypto','🪙'],other:['Other','💼']};

const live=(x,mk)=>!x.until||mk<=x.until;
function lastSnap(a,upto){const end=upto?upto+'-31':'9999';let best=null;for(const s of (a.history||[]))if(s.date<=end&&(!best||s.date>best.date||(s.date===best.date&&(s.t||0)>(best.t||0))))best=s;return best;}
function accContribs(a,upto){const out=paidEntries('a:'+a.id).map(e=>({amt:e.a,t:e.t,mk:e.mk}));for(const c of (a.contrib||[]))out.push({amt:num(c.amt),t:c.t||0,mk:monthKey(c.date)});return upto?out.filter(c=>c.mk<=upto):out;}
function accValue(a,upto){const sn=lastSnap(a,upto);if(!sn)return 0;let v=num(sn.value);for(const c of accContribs(a,upto))if(c.t>(sn.t||0))v+=c.amt;return round(v,2);}
function accPaidIn(a){if(a.startPaid===''||a.startPaid==null)return null;return round(num(a.startPaid)+accContribs(a).reduce((s,c)=>s+c.amt,0),2);}
const accUpdated=a=>{const sn=lastSnap(a);return sn?sn.date:null;};
const potsFree=()=>{const ids=new Set(D('accounts').list.map(a=>a.id));return pots().filter(p=>!p.acct||!ids.has(p.acct));};

/* budget */
function monthPlan(mk){
  const mo=(DOCS['mo-'+mk]||{data:{}}).data, ov=mo.amt||{}, paid=mo.paid||{}, skip=mo.skip||{};
  const L=(key,name,amt,extra)=>Object.assign({key,name,base:amt,amt:ov[key]!=null?num(ov[key]):amt,paid:paid[key]||null},extra);
  const P={income:[],bills:[],subs:[],savings:[],sinking:[],invest:[],debts:[],limits:[]};
  for(const i of D('budget').income)if(act(i,mk)&&!skip['i:'+i.id])P.income.push(L('i:'+i.id,i.name,num(i.amt),{ref:i,kind:'income',tick:true}));
  for(const b of D('bills').list){if(skip['b:'+b.id])continue;const ds=billDates(b,mk);if(!ds.length)continue;(b.type==='sub'?P.subs:P.bills).push(L('b:'+b.id,b.name,round(num(b.amt)*ds.length,2),{ref:b,kind:'bill',tick:true,sub:ds.map(d=>ordinal(parseKey(d).getDate())).join(', ')}));}
  for(const p of D('pots').list)if(act(p,mk)&&num(p.monthly)>0&&!skip['p:'+p.id])(p.type==='sinking'?P.sinking:P.savings).push(L('p:'+p.id,p.name,num(p.monthly),{ref:p,kind:'pot',tick:true,emoji:p.emoji}));
  for(const a of D('accounts').list)if(act(a,mk)&&num(a.monthly)>0&&!skip['a:'+a.id])P.invest.push(L('a:'+a.id,a.name,num(a.monthly),{ref:a,kind:'acct',tick:true,emoji:(ATYPES[a.type]||ATYPES.other)[1]}));
  for(const d of D('debts').list)if(act(d,mk)&&num(d.min)>0&&!skip['d:'+d.id])P.debts.push(L('d:'+d.id,d.name,num(d.min),{ref:d,kind:'debt',tick:true}));
  const sp=monthSpend(mk);
  for(const c of spendCats())if(num(c.limit)>0)P.limits.push(L('c:'+c.id,c.name,num(c.limit),{ref:c,kind:'limit',emoji:c.emoji,spent:sp.by[c.id]||0}));
  for(const e of (mo.extra||[]))if(P[e.sec])P[e.sec].push(L('x:'+e.id,e.name,num(e.amt),{ref:e,kind:'extra',tick:e.sec!=='limits'}));
  const sum=a=>a.reduce((s,x)=>s+x.amt,0);
  P.tot={};for(const k in P)if(k!=='tot')P.tot[k]=sum(P[k]);
  P.out=P.tot.bills+P.tot.subs+P.tot.savings+P.tot.sinking+P.tot.invest+P.tot.debts+P.tot.limits;
  P.left=P.tot.income-P.out;
  P.spent=sp.total;P.limitSpent=P.limits.reduce((s,x)=>s+(x.spent||0),0);
  return P;
}

const CACHE_KEY='mn_cache_v1';
let DOCS={};
try{DOCS=JSON.parse(localStorage.getItem(CACHE_KEY)||'{}')||{};}catch(e){DOCS={};}
const dirty=new Set(), inflight=new Set();
let COL=null, syncState='connecting', ready=false, lastErr='', AUTH=null, unsub=null;
function D(key){
  let e=DOCS[key];
  if(!e){e=DOCS[key]={t:0,data:clone(DEF[key]||{})};}
  const def=DEF[key];
  if(def) for(const k in def) if(e.data[k]===undefined) e.data[k]=clone(def[k]);
  return e.data;
}
const S=()=>D('settings');
let localT=null;
function persistLocal(){clearTimeout(localT);localT=setTimeout(()=>{try{localStorage.setItem(CACHE_KEY,JSON.stringify(DOCS));}catch(e){}},250);}
function save(key){if(!DOCS[key])D(key);DOCS[key].t=Date.now();dirty.add(key);persistLocal();scheduleFlush();setSync();}
let flushT=null;
function scheduleFlush(ms=700){clearTimeout(flushT);flushT=setTimeout(flush,ms);}
function flush(){if(!COL||!ready)return;for(const key of [...dirty]) if(!inflight.has(key)) writeDoc(key);}
async function writeDoc(key){
  inflight.add(key);dirty.delete(key);setSync();
  const e=DOCS[key];
  try{
    await COL.doc(key).set({json:JSON.stringify(e.data),t:e.t});
    if(syncState==='error')syncState='live';
  }catch(err){
    const code=String(err&&err.code||'');
    if(code.includes('invalid-argument')){lastErr=code;toast('That section is too big to sync. Try splitting it up.');}

function applyRemote(snap,definitive){

const cfgOk=()=>{const c=window.FIREBASE_CONFIG;return !!(c&&c.apiKey&&!/PASTE/i.test(c.apiKey)&&c.projectId);};
function initSync(){
  if(!cfgOk()){syncState='setup';ready=true;setSync();return;}

  const go=()=>window.FB.onAuth(onAuth);
  const fail=()=>{syncState='offline';ready=true;setSync();showAuth(false);};
  if(window.FB)go();else if(window.__fbFailed)fail();else{window.addEventListener('fb-ready',go,{once:true});window.addEventListener('fb-failed',fail,{once:true});}
}
function onAuth(user){
  if(unsub){unsub();unsub=null;}
  COL=null;ready=false;
  if(!user){AUTH=null;syncState='connecting';setSync();showAuth(true);return;}
  AUTH=user;showAuth(false);
  let last=null;try{last=localStorage.getItem('mn_uid');}catch(e){}
  if(last&&last!==user.uid){DOCS={};dirty.clear();try{localStorage.removeItem(CACHE_KEY);}catch(e){}applyTheme();render();}
  try{localStorage.setItem('mn_uid',user.uid);}catch(e){}
  const colRef=FB.collection(FB.db,'users',user.uid,'money');
  COL={doc:id=>({set:b=>FB.setDoc(FB.doc(colRef,id),b)})};
  syncState='connecting';setSync();
  setTimeout(()=>{if(!ready&&COL){ready=true;syncState='live';scheduleFlush(0);setSync();}},15000);
  unsub=FB.onSnapshot(colRef,{includeMetadataChanges:true},snap=>{if(!snap.metadata.fromCache&&syncState==='connecting')syncState='live';applyRemote(snap,!snap.metadata.fromCache);},err=>{syncState='error';setSync();toast('Sync paused. Changes stay on this device.');});
}

}

function lineChart(pts,labels,{h=200,fill=true}={}){

  if(mn<0)s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-dasharray="4 4"/>`;

/* ================= SAVINGS ================= */
function potCard(p){

}
function vSavings(){
  const P=pots(),g=P.filter(p=>p.type!=='sinking'),s=P.filter(p=>p.type==='sinking');

/* ================= DEBTS ================= */
function vDebts(){

  const pos=L.map(d=>payoff(debtBal(d),d.apr,d.min));const longest=pos.some(p=>p===null)?null:Math.max(0,...pos.map(p=>p.n));

  const cards=L.map((d,i)=>{const b=debtBal(d),po=pos[i],st=num(d.start)+0;const start=Math.max(b,num(d.start));return `<section class="card"><div class="card-h"><h3>${esc(d.name)}</h3><button class="link sm" data-a="debtEdit" data-id="${d.id}">Edit</button></div><div class="wstat"><b>${money(b)}</b><span class="muted">left${d.type?' · '+esc(d.type):''}</span></div>${start?bar((start-b)/start*100,'var(--good)'):''}<div class="kv" style="margin-top:8px"><span>Interest rate</span><b>${num(d.apr)}%</b></div><div class="kv"><span>Payment a month</span><b>${money(d.min)}</b></div><div class="kv"><span>Paid off</span><b>${po===null?'<span class="over">Payment doesn’t cover interest</span>':po.n===0?'Done 🎉':fmtMonthYear(addMonths(curMonth(),po.n))}</b></div>${po&&po.interest?`<div class="kv"><span>Interest still to pay</span><b>${money(po.interest)}</b></div>`:''}<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn sm soft" data-a="debtPay" data-id="${d.id}">Extra payment</button><button class="btn sm" data-a="debtSet" data-id="${d.id}">Update balance</button></div></section>`;}).join('');

  +(L.length?`<div class="stats">${stat('Total balance',mt(tot),'')}${stat('Paid off so far',mt(paid),'since you started tracking')}${stat('Payments a month',mt(min),'')}${stat('Debt-free in',free,yi?`about ${mt(yi)} interest a year`:'',true)}</div><div class="cards">${cards}</div><p class="hint" style="text-align:center">Ticking a debt payment in your budget brings the balance down. Use “Update balance” now and then to match your statement, since interest isn’t added automatically.</p>`:'<div class="empty"><p>Credit cards, loans, car finance or anything else you’re paying off.</p><button class="btn soft" data-a="debtNew">Add a debt</button></div>');
}

/* ================= ACCOUNTS ================= */
function spark(vals){if(vals.length<2)return '';const W=200,H=40,mn=Math.min(...vals),mx=Math.max(...vals),sp=mx-mn||1;const pts=vals.map((v,i)=>`${(i/(vals.length-1)*W).toFixed(1)},${(H-4-(v-mn)/sp*(H-8)).toFixed(1)}`).join(' ');return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;}
function gainTxt(g,base){if(g==null)return '';const pct=base?round(g/base*100,1):null;return `<span class="${g>=0?'pos':'over'}">${g>=0?'+':'−'}${money(Math.abs(g))}${pct!=null?` (${g>=0?'+':'−'}${Math.abs(pct)}%)`:''}</span>`;}

  const mon=L.reduce((s,a)=>s+num(a.monthly),0);
  const months=[...Array(12)].map((_,i)=>addMonths(cm,i-11));let started=false;
  const ser=months.map(m=>{const v=round(L.reduce((s,a)=>s+accValue(a,m),0),2);if(v)started=true;return started?v:null;});
  const by={};L.forEach(a=>{const k=a.type||'other';by[k]=(by[k]||0)+accValue(a);});

    const v=accValue(a),pi=accPaidIn(a),g=pi!=null?v-pi:null,up=accUpdated(a),stale=up&&diffDays(up,t)>45,ty=ATYPES[a.type]||ATYPES.other;
    const hist=(a.history||[]).slice().sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:(x.t||0)-(y.t||0)).slice(-12).map(x=>num(x.value));if(hist.length&&round(hist[hist.length-1],2)!==v)hist.push(v);
    return `<section class="card acct"><div class="card-h"><h3>${ty[1]} ${esc(a.name)}</h3><button class="link sm" data-a="accEdit" data-id="${a.id}">Edit</button></div><p class="muted" style="font-size:13px;margin-top:-6px">${esc(ty[0])}${a.provider?' · '+esc(a.provider):''}</p><div class="wstat" style="margin-top:8px"><b>${money(v)}</b>${g!=null?gainTxt(g,pi):''}</div>${spark(hist)}${pi!=null?`<div class="kv"><span>Paid in</span><b>${money(pi)}</b></div>`:''}${num(a.monthly)?`<div class="kv"><span>Each month</span><b>${money(a.monthly)}</b></div>`:''}<div class="kv"><span>Value updated</span><b class="${stale?'over':''}">${up?(up===t?'Today':fmtShort(up)+(stale?' · update due':'')):'Never'}</b></div><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn sm soft" data-a="accVal" data-id="${a.id}">Update value</button><button class="btn sm" data-a="accMoney" data-id="${a.id}" data-dir="1">Pay in</button><button class="btn sm" data-a="accMoney" data-id="${a.id}" data-dir="-1">Take out</button></div></section>`;}).join('');
  return ph('Accounts & investments','Everywhere your money lives',add)
  +`<div class="stats">${stat('Total worth',mt(tot),plural(L.length,'account'),true)}${stat('Paid in',wp.length?mt(paid):'–',wp.length?(wp.length<L.length?`${wp.length} of ${L.length} accounts`:'by you'):'add it to see growth')}${stat('Growth',wp.length?`${gain>=0?'+':'−'}${mt(Math.abs(gain))}`:'–',wp.length&&paid?`${gain>=0?'+':'−'}${Math.abs(round(gain/paid*100,1))}% overall`:'')}${stat('Going in',mt(mon),'every month')}</div>`
  +`<div class="cards">${card('Worth over the last year',lineChart(ser,months.map((m,i)=>i%2===1?MON[+m.slice(5)-1]:'')))}${card('By type',types)}${cards}</div>`
  +`<p class="hint" style="text-align:center">Update investment values whenever you check them, about once a month is plenty. Money you pay in, or tick off in your budget, is added straight away.</p>`;
}

const VIEWS={overview:vOverview,accounts:vAccounts,budget:vBudget,spending:vSpending,bills:vBills,savings:vSavings,debts:vDebts,insights:vInsights,settings:vSettings};

/* ================= sheets ================= */
function openSheet(st){SH=st;drawSheet(true);}
function drawSheet(first){
  if(!SH)return;
  const el=$('#sheet'), r=SH.draw();
  if(first||!el.classList.contains('open')){
    el.innerHTML=`<div class="sheet-bg" data-a="closeSheet"></div><div class="sheet-card ${r.wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="shT"><div class="sheet-head"><h2 id="shT"></h2><button class="icon-btn" data-a="closeSheet" aria-label="Close">×</button></div><div class="sheet-body"></div><div class="sheet-foot"></div></div>`;
    el.classList.add('open');document.body.classList.add('noscroll');
  }
  $('#shT').textContent=r.title;
  const b=$('.sheet-body',el), sc=b.scrollTop;b.innerHTML=r.body;b.scrollTop=sc;
  const f=$('.sheet-foot',el);f.innerHTML=r.foot||'';f.hidden=!r.foot;
  if(first)setTimeout(()=>{const a=el.querySelector('[autofocus]');if(a&&window.matchMedia&&window.matchMedia('(min-width:700px)').matches)a.focus();},60);
}
function closeSheet(){const el=$('#sheet');el.classList.remove('open');el.innerHTML='';SH=null;document.body.classList.remove('noscroll');render();}
function liveSheet(st){st.refresh=()=>drawSheet(false);openSheet(st);}
const fv=n=>{const el=$(`#sheet [name="${n}"]`);if(!el)return'';if(el.type==='radio'){const c=$(`#sheet [name="${n}"]:checked`);return c?c.value:'';}if(el.type==='checkbox')return el.checked;return el.value;};
const fvAll=n=>$$(`#sheet [name="${n}"]:checked`).map(e=>e.value);
const foot=(save,del='',saveLabel='Save')=>`${del}<span class="sp"></span><button class="btn" data-a="closeSheet">Cancel</button><button class="btn primary" data-a="${save}">${saveLabel}</button>`;
function setPath(o,path,v){const ps=path.split('.');for(let i=0;i<ps.length-1;i++){o=o[ps[i]];if(o==null)return;}o[ps[ps.length-1]]=v;}
/* ================= money sheets ================= */
const moneyIn=(name,val,attrs='')=>`<input class="in" inputmode="decimal" name="${name}" value="${val==null||val===''?'':esc(val)}" ${attrs}>`;
function catPick(sel,action='txCat',kinds=['spend','income','transfer']){return `<div class="chips">${S().cats.filter(c=>kinds.includes(c.kind)).map(c=>`<button class="chip sm ${sel===c.id?'on':''}" data-a="${action}" data-v="${c.id}" aria-pressed="${sel===c.id}">${c.emoji} ${esc(c.name)}</button>`).join('')}</div>`;}
function skipBtn(key){return SH&&SH.mk?`<button class="btn" data-a="skipMonth" data-key="${key}">Remove from ${MON[+SH.mk.slice(5)-1]} only</button>`:'';}

/* import */
function importSheet(){
  liveSheet({kind:'import',step:'pick',rows:null,map:null,draw(){
    if(this.step==='pick')return {title:'Import a statement',body:`<p style="margin-bottom:12px">Download a CSV statement from your banking app or website, then choose it here. Overlapping dates are fine: anything already imported is skipped.</p><label class="btn primary" style="width:100%">Choose CSV file<input type="file" accept=".csv,text/csv,text/plain,application/vnd.ms-excel" class="vh" data-ch="importFile"></label><details class="more" style="margin-top:16px"><summary>Where do I find the CSV?</summary><p class="hint" style="margin:6px 0 0">Most UK banks have it under your statement or transactions page as “Export” or “Download transactions”. Lloyds: online banking on a computer, open the account, then “Export”. Monzo and Starling: in the app under statements. Amex: online statements, “Download”. Choose the CSV format.</p></details>`};
    if(this.step==='map'){
      const m=this.map,H=m.head,opt=(sel)=>`<option value="-1">Not used</option>`+H.map((h,i)=>`<option value="${i}" ${sel===i?'selected':''}>${esc(h||('Column '+(i+1)))}</option>`).join('');
      const split=m.amt<0;const prev=mapRows(this.rows,m);
      return {title:'Check the columns',wide:true,body:`<p class="hint">I’ve guessed which columns are which. Check the preview looks right, then import.</p>
      <div class="frow"><label class="field"><span>Date</span><select class="in" data-ch="impSet" data-k="date">${opt(m.date)}</select></label><label class="field"><span>Description</span><select class="in" data-ch="impSet" data-k="desc">${opt(m.desc)}</select></label></div>
      <div class="chips" style="margin-bottom:10px"><button class="chip sm ${!split?'on':''}" data-a="impMode" data-v="one">One amount column</button><button class="chip sm ${split?'on':''}" data-a="impMode" data-v="split">Separate money out and in</button></div>
      ${split?`<div class="frow"><label class="field"><span>Money out</span><select class="in" data-ch="impSet" data-k="out">${opt(m.out)}</select></label><label class="field"><span>Money in</span><select class="in" data-ch="impSet" data-k="inn">${opt(m.inn)}</select></label></div>`:`<label class="field"><span>Amount</span><select class="in" data-ch="impSet" data-k="amt">${opt(m.amt)}</select></label><label class="cardopt" style="border:0"><input type="checkbox" ${m.flip?'checked':''} data-ch="impFlip" style="width:20px;height:20px;accent-color:var(--accent)"> Spending shows as positive numbers (common on credit cards)</label>`}
      <div class="field"><span>Dates are written</span><div class="chips"><button class="chip sm ${m.fmt!=='mdy'?'on':''}" data-a="impFmt" data-v="dmy">Day first (UK)</button><button class="chip sm ${m.fmt==='mdy'?'on':''}" data-a="impFmt" data-v="mdy">Month first (US)</button></div></div>
      <label class="field"><span>Account name (optional)</span><input class="in" value="${esc(m.acct||'')}" data-bind="map.acct" placeholder="e.g. Lloyds current or Amex"></label>
      <div class="lbl" style="margin:6px 0">Preview: ${plural(prev.length,'transaction')} found</div>
      ${prev.slice(0,6).map(r=>`<div class="trow sm"><span class="muted" style="min-width:58px">${fmtShort(r.date)}</span><span class="t">${esc(niceName(r.desc))}</span><b class="${r.amt>0?'pos':''}">${r.amt>0?'+':'−'}${money(Math.abs(r.amt))}</b></div>`).join('')||'<p class="over">Nothing readable yet. Check the date and amount columns.</p>'}
      <p class="hint" style="margin-top:8px">Spending should show with a minus and money coming in with a plus.</p>`,foot:foot('impGo','',prev.length?`Import ${prev.length}`:'Import')};
    }
    const r=this.result;
    return {title:'Imported',body:`<div class="glance" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px"><div><b>${r.added}</b><span>added</span></div><div><b>${r.dupes}</b><span>already there</span></div><div><b>${r.review}</b><span>to sort</span></div></div><p class="muted">${r.review?'Most transactions were sorted into categories automatically. A few need you to choose; each one you set can become a rule so it’s automatic next time.':'Everything was sorted into categories automatically.'}</p>`,foot:`<span class="sp"></span>${r.review?'<button class="btn" data-a="closeSheet">Later</button><button class="btn primary" data-a="impReview">Sort them now</button>':'<button class="btn primary" data-a="closeSheet">Done</button>'}`};
  }});
}

    const c=catOf(this.cat);
    return {title:niceName(t.desc),body:`<div class="wstat"><b class="${t.amt>0?'pos':''}">${t.amt>0?'+':'−'}${money(Math.abs(t.amt))}</b><span class="muted">${fmtLong(t.date)}${t.acct?' · '+esc(t.acct):''}</span></div><p class="hint" style="margin-bottom:12px">${esc(t.desc)}</p>
    <div class="field"><span>Category</span>${catPick(this.cat)}</div>
    ${this.cat?`<label class="cardopt" style="border:0;flex-wrap:wrap"><input type="checkbox" ${this.always?'checked':''} data-bind="always" style="width:20px;height:20px;accent-color:var(--accent)"> Always put anything containing</label><input class="in sm" value="${esc(this.match)}" data-bind="match" style="margin:4px 0 12px" aria-label="Words to match"><p class="hint">in ${c?c.emoji+' '+esc(c.name):''}. Applies to past and future imports.</p>`:''}

function authErr(x){const c=String(x&&x.code||'');
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return 'That email or password isn’t right.';
  if(c.includes('email-already-in-use'))return 'There’s already an account with that email. Try signing in.';

/* ================= events & init ================= */
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-a]');if(!t||t.disabled)return;const fn=A[t.dataset.a];if(fn){if(t.tagName==='A')ev.preventDefault();fn(t,ev);}});
function bindSet(el){if(!SH)return;setPath(SH,el.dataset.bind,el.type==='checkbox'?el.checked:el.value);}
document.addEventListener('input',ev=>{const el=ev.target;if(el.dataset.bind)bindSet(el);const a=el.dataset.live;if(a&&A[a])A[a](el,ev);});
document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset.bind)bindSet(el);const a=el.dataset.ch;if(a&&A[a])A[a](el,ev);});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){if(SH)closeSheet();else closeDrawer();return;}
  if(ev.key==='Enter'&&!ev.isComposing){const el=ev.target;if(el.dataset&&el.dataset.enter&&A[el.dataset.enter]){ev.preventDefault();A[el.dataset.enter](el,ev);}}
});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(pendingRender&&!isTyping())render();},0);});
let lastDay=todayKey();
function checkDay(){const t=todayKey();if(t!==lastDay){lastDay=t;if(!SH)render(false);}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDay();});
window.addEventListener('focus',checkDay);
setInterval(checkDay,60000);
applyTheme();
render();
initSync();
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

</script>
<script type="module">
const V='10.12.2', B='https://www.gstatic.com/firebasejs/'+V+'/';
const cfg=window.FIREBASE_CONFIG;
if(cfg&&cfg.apiKey&&!/PASTE/i.test(cfg.apiKey)&&cfg.projectId){
  try{
    const [{initializeApp},A,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
    const app=initializeApp(cfg), auth=A.getAuth(app);
    let db;
    try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})});}catch(e){db=F.getFirestore(app);}
    window.FB={db,collection:F.collection,doc:F.doc,setDoc:F.setDoc,onSnapshot:F.onSnapshot,
      onAuth:cb=>A.onAuthStateChanged(auth,cb),
      signIn:(e,p)=>A.signInWithEmailAndPassword(auth,e,p),
      signUp:(e,p)=>A.createUserWithEmailAndPassword(auth,e,p),
      reset:e=>A.sendPasswordResetEmail(auth,e),
      signOut:()=>A.signOut(auth)};
    window.dispatchEvent(new Event('fb-ready'));
  }catch(e){console.error(e);window.__fbFailed=true;window.dispatchEvent(new Event('fb-failed'));}
}
</script>
